<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>weoc-ui — Event Timeline (wui-tile, standalone)</title>
<link rel="stylesheet" href="../../CSS/material-symbols-outlined/material-symbols-outlined.css">
<link rel="stylesheet" href="../../CSS/weoc-ui/weoc-ui-core.css">
<link rel="stylesheet" href="../../CSS/uPlot.min.css">
</head>
<body>
  <div class="wui-p-3" style="max-width: 420px;">
    <div class="wui-bento-tile">
      <div class="chart-card">
        <div class="wui-tile">
          <div class="wui-tile-hdr">
            <div class="wui-tile-title-wrap">
              <h3 class="wui-tile-title">Event Timeline</h3>
              <div class="wui-tile-sub">Weekly event trend</div>
            </div>
            <div class="wui-tile-icon blue"><span class="material-symbols-outlined">timeline</span></div>
          </div>

          <div class="wui-tile-body" style="height: 220px;">
            <div id="eventTimelineChart" style="height: 100%;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../JS/uPlot.iife.min.js"></script>
  <script src="../../JS/weoc-ui.js"></script>
  <script src="../../JS/wui-charts.js"></script>
  <script>
    // Stand-in for the real board's <value-of select="//@event_timeline_values_expr" />,
    // a JSON array of the last 7 days' event counts.
    var EVENT_TIMELINE_VALUES = [12, 15, 11, 18, 14, 20, 17];

    var eventTimelineHandle = null;

    function drawEventTimelineChart() {
      var host = document.getElementById('eventTimelineChart');
      var values = EVENT_TIMELINE_VALUES;
      if (!values.length) { return; }

      var timestamps = [];
      var now = Math.floor(Date.now() / 1000);
      var dayInSeconds = 86400;
      for (var i = values.length - 1; i >= 0; i--) {
        timestamps.unshift(now - i * dayInSeconds);
      }

      var chartOpts = {
        type: 'area',
        series: [{ label: 'Events', color: 'primary' }],
        data: [timestamps, values],
        // real board.web sizes off the LIVE container height, not a fixed constant —
        // kept as-is here since it already scales correctly with .wui-tile-body's height
        height: Math.max(140, (host.offsetHeight || 220) - 24),
        legend: false
      };

      if (eventTimelineHandle) {
        eventTimelineHandle.update(chartOpts.data);
      } else if (window.uPlot) {
        eventTimelineHandle = WUI.chart(host, chartOpts);
      }
    }

    WUI.ready(drawEventTimelineChart);
  </script>
</body>
</html>
