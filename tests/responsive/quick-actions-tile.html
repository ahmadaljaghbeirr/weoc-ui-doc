<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>weoc-ui — Quick Actions (wui-tile + wui-grid buttons, standalone)</title>
<link rel="stylesheet" href="../../CSS/material-symbols-outlined/material-symbols-outlined.css">
<link rel="stylesheet" href="../../CSS/weoc-ui/weoc-ui-core.css">
</head>
<body>
  <div class="wui-p-3" style="max-width: 420px;">
    <div class="wui-bento-tile">
      <div class="wui-tile">
        <div class="wui-tile-hdr">
          <div class="wui-tile-title-wrap">
            <h3 class="wui-tile-title">Quick Actions</h3>
            <div class="wui-tile-sub">Quick actions to modules</div>
          </div>
          <div class="wui-tile-icon blue"><span class="material-symbols-outlined">arrow_split</span></div>
        </div>
        <div class="wui-tile-body">
          <div class="wui-grid wui-grid-6 compact wui-gap-2">
            <button type="button" class="js-quick-action-btn wui-btn vertical square xs outline primary" data-action="add-event" title="Add Event">
              <span class="material-symbols-outlined">add_circle</span>
            </button>
            <button type="button" class="js-quick-action-btn wui-btn vertical square xs outline success" data-action="add-task" title="Add Task">
              <span class="material-symbols-outlined">add_task</span>
            </button>
            <button type="button" class="js-quick-action-btn wui-btn vertical square xs outline warning" data-action="send-notification" title="Notify">
              <span class="material-symbols-outlined">notifications_active</span>
            </button>
            <button type="button" class="js-quick-action-btn wui-btn vertical square xs outline primary" data-action="add-event" title="Add Facility">
              <span class="material-symbols-outlined">domain</span>
            </button>
            <button type="button" class="js-quick-action-btn wui-btn vertical square xs outline success" data-action="add-task" title="Add Resources">
              <span class="material-symbols-outlined">inventory_2</span>
            </button>
            <button type="button" class="js-quick-action-btn wui-btn vertical square xs outline warning" data-action="send-notification" title="File Library">
              <span class="material-symbols-outlined">folder</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../JS/weoc-ui.js"></script>
  <script>
    // Real board.web pattern: one delegated click handler keyed off data-action,
    // instead of a per-button onclick. The real quick-actions.js resolves
    // data-action -> a board/view navigation (viewlink-equivalent); here it
    // just logs, since there's no board to navigate to in this standalone page.
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.js-quick-action-btn');
      if (!btn) { return; }
      console.log('Quick action:', btn.getAttribute('data-action'), '->', btn.getAttribute('title'));
    });
  </script>
</body>
</html>
