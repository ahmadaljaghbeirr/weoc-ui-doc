<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>weoc-ui — Event Closure Performance (wui-tile, standalone)</title>
<link rel="stylesheet" href="../../CSS/material-symbols-outlined/material-symbols-outlined.css">
<link rel="stylesheet" href="../../CSS/weoc-ui/weoc-ui-core.css">
</head>
<body>
  <div class="wui-p-3" style="max-width: 320px;">
    <div class="wui-bento-tile">
      <div class="chart-card">
        <div class="wui-tile">
          <div class="wui-tile-hdr">
            <div class="wui-tile-title-wrap">
              <h3 class="wui-tile-title">Event Closure Performance</h3>
              <div class="wui-tile-sub">Percentage of events closed out of total reported events in the last 7 days</div>
            </div>
            <div class="wui-tile-icon blue"><span class="material-symbols-outlined">speed</span></div>
          </div>

          <div class="wui-tile-body wui-flex wui-flex-col wui-items-center wui-gap-2">
            <div id="eventClosureGauge"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../JS/weoc-ui.js"></script>
  <script src="../../JS/wui-charts.js"></script>
  <script>
    // Stand-in for the real board's <value-of select="//@event_closure_rate_expr" />
    var EVENT_CLOSURE_PERCENTAGE = 50;

    var eventClosureGaugeHandle = null;

    function drawEventClosureGauge() {
      var host = document.getElementById('eventClosureGauge');
      var percentage = Math.max(0, Math.min(EVENT_CLOSURE_PERCENTAGE, 100));

      var status = 'Good closure';
      if (percentage < 40) {
        status = 'Needs attention';
      } else if (percentage < 70) {
        status = 'In Progress';
      }

      var gaugeOpts = { value: percentage, status: status, height: 128 }; // matches real board.web height exactly

      if (eventClosureGaugeHandle) {
        eventClosureGaugeHandle.update(gaugeOpts);
      } else if (window.WUI && WUI.gauge) {
        eventClosureGaugeHandle = WUI.gauge(host, gaugeOpts);
      }
    }

    WUI.ready(drawEventClosureGauge);
  </script>
</body>
</html>
