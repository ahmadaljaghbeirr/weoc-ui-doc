<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>weoc-ui — Total Events KPI (kpi-card, standalone)</title>
<link rel="stylesheet" href="../../CSS/material-symbols-outlined/material-symbols-outlined.css">
<link rel="stylesheet" href="../../CSS/weoc-ui/weoc-ui-core.css">
<style>
  /* kpi-card.css, trimmed to what this recipe uses — page-local until proven
     reusable elsewhere per the component-promotion convention. */
  .wui-grid > .kpi-card {
    align-items: flex-start; justify-content: flex-start; flex-direction: column;
    padding: var(--space-2); gap: var(--space-2); background: var(--color-30);
    border: 1px solid var(--color-border); border-radius: var(--border-radius);
    color: var(--color-text-primary); min-width: 0; overflow: hidden; height: fit-content;
  }
  .kpi-header { display: flex; align-items: center; gap: var(--space-2); width: 100%; }
  .kpi-icon { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center;
    background: var(--color-10-light); color: var(--color-10); flex: 0 0 auto; }
  .kpi-icon .material-symbols-outlined { font-size: 16px; }
  .kpi-title { font-size: var(--text-xs); font-weight: var(--font-bold); color: var(--color-text-primary);
    letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; }
  .kpi-value { font-size: 22px; font-weight: var(--font-bold); line-height: 1; color: var(--color-text-primary); }
  .kpi-body { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); width: 100%; min-width: 0; }
  .kpi-main { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; flex: 0 0 auto; }
  .kpi-chart { min-width: 0; flex: 1 1 auto; }
  .kpi-trend { display: flex; align-items: center; gap: 4px; font-size: var(--text-xs); min-width: 0; white-space: nowrap; }
  .kpi-trend .kpi-arrow, .kpi-trend .kpi-percent { color: var(--color-success); }
  .kpi-trend.danger .kpi-arrow, .kpi-trend.danger .kpi-percent { color: var(--color-danger); }
  .kpi-arrow { font-size: 15px; }
  .kpi-percent { font-weight: var(--font-semibold); }
  .kpi-text { color: var(--color-text-secondary); }
  .sparkline { width: 100%; height: 26px; display: block; flex: auto; }
</style>
</head>
<body>
  <div class="wui-p-3" style="max-width: 280px;">
    <div class="wui-bento-tile">
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-icon"><span class="material-symbols-outlined">event</span></div>
          <div class="kpi-title">Total Events</div>
        </div>
        <div class="kpi-body wui-h-full wui-w-full">
          <div class="kpi-main">
            <div class="kpi-value" id="totalEventsValue"></div>
            <div class="kpi-trend" id="totalEventsTrend">
              <span class="material-symbols-outlined kpi-arrow" id="totalEventsArrow"></span>
              <span class="kpi-percent" id="totalEventsPercent"></span>
              <span class="kpi-text">vs last 7 days</span>
            </div>
          </div>
          <div class="kpi-chart">
            <canvas class="sparkline" id="sparkTotal"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../JS/weoc-ui.js"></script>
  <script>
    // Stand-in for the real board's //@total_events_expr / //@events_trend_status_expr /
    // //@events_trend_percentage_expr / //@events_daily_last_7_days_expr.
    var TOTAL_EVENTS = 47;
    var TREND_STATUS = 'Up';
    var TREND_PERCENT = 12;
    var SPARK_DATA = [30, 34, 29, 41, 38, 45, 47];

    // Exact from board.web / kpi-sparklines.js — canvas-only, no chart engine dependency.
    function drawSparkline(selector, data, color) {
      var canvas = document.querySelector(selector);
      if (!canvas || !data || !data.length) { return; }

      var ctx = canvas.getContext('2d');
      var width = canvas.offsetWidth;
      var height = canvas.offsetHeight;
      var ratio = window.devicePixelRatio || 1;

      canvas.width = width * ratio;
      canvas.height = height * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, width, height);

      var padding = 4;
      var max = Math.max.apply(null, data);
      var min = Math.min.apply(null, data);
      var range = max - min || 1;
      var stepX = data.length > 1 ? (width - padding * 2) / (data.length - 1) : 0;

      var points = data.map(function (value, index) {
        var x = padding + index * stepX;
        var y = height - padding - ((value - min) / range) * (height - padding * 2);
        return { x: x, y: y };
      });

      function drawSmoothPath(ctx, points) {
        ctx.moveTo(points[0].x, points[0].y);
        for (var i = 0; i < points.length - 1; i++) {
          var current = points[i], next = points[i + 1];
          var midX = (current.x + next.x) / 2, midY = (current.y + next.y) / 2;
          ctx.quadraticCurveTo(current.x, current.y, midX, midY);
        }
        var lastPoint = points[points.length - 1];
        ctx.lineTo(lastPoint.x, lastPoint.y);
      }

      function hexToRgba(hex, alpha) {
        var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
      }

      var sparkColor = color === 'danger' ? '#dc2626' : '#16a34a';
      var gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, hexToRgba(sparkColor, 0.28));
      gradient.addColorStop(0.5, hexToRgba(sparkColor, 0.12));
      gradient.addColorStop(1, hexToRgba(sparkColor, 0));

      ctx.beginPath();
      drawSmoothPath(ctx, points);
      ctx.lineTo(points[points.length - 1].x, height - padding);
      ctx.lineTo(points[0].x, height - padding);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

      ctx.beginPath();
      drawSmoothPath(ctx, points);
      ctx.lineWidth = 2;
      ctx.strokeStyle = hexToRgba(sparkColor, 0.85);
      ctx.shadowBlur = 8;
      ctx.shadowColor = hexToRgba(sparkColor, 0.5);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function drawTotalEventsKpi() {
      var trendColor = TREND_STATUS === 'Down' ? 'danger' : 'success';
      document.getElementById('totalEventsValue').textContent = TOTAL_EVENTS;
      document.getElementById('totalEventsTrend').className = 'kpi-trend' + (trendColor === 'danger' ? ' danger' : '');
      document.getElementById('totalEventsArrow').textContent = TREND_STATUS === 'Up' ? 'arrow_upward' : 'arrow_downward';
      document.getElementById('totalEventsPercent').textContent = TREND_PERCENT + '%';
      drawSparkline('#sparkTotal', SPARK_DATA, trendColor);
    }

    WUI.ready(drawTotalEventsKpi);
  </script>
</body>
</html>
